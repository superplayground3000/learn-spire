server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    trust_domain = "lab.local"

    data_dir  = "/var/lib/spire/server"
    log_level = "DEBUG"

    ca_ttl                = "24h"
    default_x509_svid_ttl = "1h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }

    # An operator gives the agent a one-time join token. The spike proves the
    # docker workload attestor, not a node attestor, so this stays simple.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire/server/keys.json"
        }
    }
}
