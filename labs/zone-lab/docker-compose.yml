name: zone-lab

# Zone-lab. The lab moves the enforcement point out of the app code and into
# Envoy. Three security zones plus one control plane. Phase 2 adds a management
# plane (mgmt-a, mgmt-b, mgmt-c) and a registry that multi-homes on it.
# One SPIRE agent uses docker:label attestation. The agent serves the Workload
# API on a socket in a shared volume. That socket crosses the internal zone
# networks, so a workload gets its identity without a route to the server.
#
# Trap 4: a workload needs no control network. Only the server and the agent
# sit on control. The shared socket volume carries the Workload API.

# Every zone node starts from one image. Only the label, the network, and the
# started process differ.
x-node: &node
  image: zone-lab:1.15.2
  build:
    context: .
    dockerfile: docker/Dockerfile
  # Read-only: a node connects to the socket, but it must not delete or replace
  # it for the other nodes.
  volumes:
    - spire-agent-socket:/run/spire:ro
  depends_on:
    - spire-agent

services:
  # --- Control plane, on the "control" network only -------------------------
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.2
    container_name: zone-lab-spire-server
    hostname: spire-server
    command: ["-config", "/etc/spire/server/server.conf"]
    volumes:
      - ./infra/spire/server.conf:/etc/spire/server/server.conf:ro
      - spire-server-data:/var/lib/spire/server
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      control: {}

  # The agent runs alone. The docker attestor reads the other containers'
  # labels through the Docker socket, so it needs pid:host and docker.sock.
  spire-agent:
    <<: *node
    container_name: zone-lab-spire-agent
    hostname: spire-agent
    depends_on:
      spire-server:
        condition: service_healthy
    init: true
    # The attestor reads /proc/<pid>/ of the calling process. It needs the host
    # PID namespace to see a workload PID at all.
    pid: "host"
    volumes:
      - ./infra/spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The agent OWNS the socket volume; it mounts it read-write.
      - spire-agent-socket:/run/spire
    networks:
      control: {}

  # --- Zone B gateway: dual-homed on zone-a and zone-b ----------------------
  # It admits only zone-a/client at Layer 7, then re-originates mTLS to the
  # zone-b backend and pins the backend SPIFFE ID.
  zone-b-gateway:
    <<: *node
    container_name: zone-lab-zone-b-gateway
    hostname: zone-b-gateway
    labels:
      spiffe.lab/workload: "zone-b-gateway"
    volumes:
      - spire-agent-socket:/run/spire:ro
      - ./conf/zone-b-gateway-envoy.yaml:/etc/envoy/zone-b-gateway-envoy.yaml:ro
    networks:
      zone-a: { ipv4_address: 10.10.0.40 }
      zone-b: { ipv4_address: 10.20.0.40 }

  # --- Zone B backend: on zone-b only ---------------------------------------
  # Envoy fronts the Go backend app on 127.0.0.1:8080. It admits only the
  # zone-b gateway identity, by a SAN pin and a network RBAC filter.
  # The backend joins mgmt-b too. mgmt-b carries only registry traffic. It is a
  # separate internal network, so it adds no cross-zone data path. The data
  # plane stays on zone-b.
  zone-b-backend:
    <<: *node
    container_name: zone-lab-zone-b-backend
    hostname: zone-b-backend
    labels:
      spiffe.lab/workload: "zone-b-backend"
    environment:
      ZONE: "zone-b"
    volumes:
      - spire-agent-socket:/run/spire:ro
      - ./conf/zone-b-backend-envoy.yaml:/etc/envoy/zone-b-backend-envoy.yaml:ro
    networks:
      zone-b: { ipv4_address: 10.20.0.50 }
      mgmt-b: { ipv4_address: 10.50.0.50 }

  # --- Zone C gateway: dual-homed on zone-b and zone-c ----------------------
  # It admits only zone-b/backend at Layer 7. Zone A cannot reach it at all.
  zone-c-gateway:
    <<: *node
    container_name: zone-lab-zone-c-gateway
    hostname: zone-c-gateway
    labels:
      spiffe.lab/workload: "zone-c-gateway"
    volumes:
      - spire-agent-socket:/run/spire:ro
      - ./conf/zone-c-gateway-envoy.yaml:/etc/envoy/zone-c-gateway-envoy.yaml:ro
    networks:
      zone-b: { ipv4_address: 10.20.0.41 }
      zone-c: { ipv4_address: 10.30.0.40 }

  # --- Zone C backend: on zone-c only ---------------------------------------
  zone-c-backend:
    <<: *node
    container_name: zone-lab-zone-c-backend
    hostname: zone-c-backend
    labels:
      spiffe.lab/workload: "zone-c-backend"
    environment:
      ZONE: "zone-c"
    volumes:
      - spire-agent-socket:/run/spire:ro
      - ./conf/zone-c-backend-envoy.yaml:/etc/envoy/zone-c-backend-envoy.yaml:ro
    networks:
      zone-c: { ipv4_address: 10.30.0.50 }
      mgmt-c: { ipv4_address: 10.60.0.50 }

  # --- The registry: multi-homed on all three mgmt networks -----------------
  # The registry is the only container on more than one mgmt network. It does
  # not forward between them, so mgmt-a, mgmt-b, and mgmt-c stay isolated. A Go
  # plain-HTTP server holds the records. Its Envoy sidecar terminates mTLS and
  # sets the XFCC header. The registry reads the caller only from that header.
  zone-registry:
    <<: *node
    container_name: zone-lab-zone-registry
    hostname: zone-registry
    labels:
      spiffe.lab/workload: "zone-registry"
    environment:
      LEASE_TTL: "30"
      REAP_INTERVAL: "5"
      POLICY_JSON: '{"zone-a":["zone-b"],"zone-b":["zone-c"]}'
    volumes:
      - spire-agent-socket:/run/spire:ro
      - ./conf/zone-registry-envoy.yaml:/etc/envoy/zone-registry-envoy.yaml:ro
      - registry-views:/views
    networks:
      mgmt-a: { ipv4_address: 10.40.0.10 }
      mgmt-b: { ipv4_address: 10.50.0.10 }
      mgmt-c: { ipv4_address: 10.60.0.10 }

  # --- Zone A peer: the intra-zone plaintext target -------------------------
  # The client calls the peer over plain HTTP, with no mTLS and no gateway.
  # This proves mTLS happens only at the zone boundary (property P10).
  zone-a-peer:
    <<: *node
    container_name: zone-lab-zone-a-peer
    hostname: zone-a-peer
    labels:
      spiffe.lab/workload: "zone-a-peer"
    networks:
      zone-a: { ipv4_address: 10.10.0.30 }

  # --- One-shot workloads, in the "demo" profile ----------------------------
  # These run with "docker compose run --rm". Compose applies the service label,
  # so the agent attests the run container by its container label.
  zone-a-client:
    <<: *node
    container_name: zone-lab-zone-a-client
    hostname: zone-a-client
    profiles: ["demo"]
    labels:
      spiffe.lab/workload: "zone-a-client"
    networks:
      zone-a: { ipv4_address: 10.10.0.20 }

  zone-a-intruder:
    <<: *node
    container_name: zone-lab-zone-a-intruder
    hostname: zone-a-intruder
    profiles: ["demo"]
    labels:
      spiffe.lab/workload: "zone-a-intruder"
    networks:
      zone-a: { ipv4_address: 10.10.0.21 }

  # zone-a-unregistered gets NO entry, on purpose. It proves that a container
  # with no registration entry gets no SVID (property P11).
  zone-a-unregistered:
    <<: *node
    container_name: zone-lab-zone-a-unregistered
    hostname: zone-a-unregistered
    profiles: ["demo"]
    labels:
      spiffe.lab/workload: "zone-a-unregistered"
    networks:
      zone-a: { ipv4_address: 10.10.0.22 }

  # --- CoreDNS: one resolver per zone (phase-2 part B) ----------------------
  # Each resolver sits on its own zone network at a fixed address (.53). It
  # mounts the shared registry-views volume READ-ONLY and serves ONLY its own
  # zone's view file with the file plugin. The SOA in the view makes an absent
  # name return NXDOMAIN, not SERVFAIL. reload 5s lands a new view with no
  # restart. DNS is steering only; the phase-1 network and identity layers
  # enforce (property P19 proves this).
  #
  # These resolvers sit in the "dns" profile, so plain "up -d" does not start
  # them. lab-up starts them last, after the registry has rendered the views. A
  # file plugin with a missing file fails to load, so the views must exist first.
  # They are still always-up: long-lived services, not one-shot demo workloads.
  coredns-a:
    image: coredns/coredns:1.11.3
    container_name: zone-lab-coredns-a
    hostname: coredns-a
    profiles: ["dns"]
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./conf/coredns/Corefile.zone-a:/etc/coredns/Corefile:ro
      - registry-views:/etc/coredns/views:ro
    networks:
      zone-a: { ipv4_address: 10.10.0.53 }

  coredns-b:
    image: coredns/coredns:1.11.3
    container_name: zone-lab-coredns-b
    hostname: coredns-b
    profiles: ["dns"]
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./conf/coredns/Corefile.zone-b:/etc/coredns/Corefile:ro
      - registry-views:/etc/coredns/views:ro
    networks:
      zone-b: { ipv4_address: 10.20.0.53 }

  coredns-c:
    image: coredns/coredns:1.11.3
    container_name: zone-lab-coredns-c
    hostname: coredns-c
    profiles: ["dns"]
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./conf/coredns/Corefile.zone-c:/etc/coredns/Corefile:ro
      - registry-views:/etc/coredns/views:ro
    networks:
      zone-c: { ipv4_address: 10.30.0.53 }

networks:
  # The control network is a normal bridge. The server and the agent use it.
  control:
    driver: bridge
  # internal: true removes the off-network default route. A blocked cross-zone
  # probe then returns "Network is unreachable", not "Connection refused". This
  # difference is load-bearing for property P1.
  zone-a:
    internal: true
    ipam: { config: [{ subnet: 10.10.0.0/24 }] }
  zone-b:
    internal: true
    ipam: { config: [{ subnet: 10.20.0.0/24 }] }
  zone-c:
    internal: true
    ipam: { config: [{ subnet: 10.30.0.0/24 }] }
  # The management plane: one internal network per zone. The registry multi-homes
  # on all three. A registering workload joins only its own zone's mgmt network.
  # So a workload reaches the registry, but not a workload in another zone. The
  # registry does not forward, so mgmt-a, mgmt-b, and mgmt-c stay isolated.
  mgmt-a:
    internal: true
    ipam: { config: [{ subnet: 10.40.0.0/24 }] }
  mgmt-b:
    internal: true
    ipam: { config: [{ subnet: 10.50.0.0/24 }] }
  mgmt-c:
    internal: true
    ipam: { config: [{ subnet: 10.60.0.0/24 }] }

volumes:
  spire-server-data: {}
  # Holds the Workload API socket and the bootstrap trust bundle. Every node
  # that mounts it sees the same directory across the internal networks.
  spire-agent-socket: {}
  # Holds the rendered CoreDNS zone files. The registry writes it. The CoreDNS
  # containers (phase-2 part B) mount it read-only.
  registry-views: {}
