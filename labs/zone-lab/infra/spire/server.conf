server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    trust_domain = "lab.local"

    data_dir  = "/var/lib/spire/server"
    log_level = "DEBUG"

    # The SVID lifetime is 5m from the start. There is no CRL. The TTL is the
    # worst-case containment window after a revocation. Property P9 measures
    # this window. The README carries the reason.
    ca_ttl                = "24h"
    default_x509_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }

    # An operator gives the agent a one-time join token. The lab proves the
    # docker workload attestor, not a node attestor, so this stays simple.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire/server/keys.json"
        }
    }
}
