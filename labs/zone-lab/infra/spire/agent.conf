agent {
    data_dir     = "/var/lib/spire/agent"
    log_level    = "DEBUG"
    trust_domain = "lab.local"

    # Only the agent talks to the server. The workloads never learn this
    # address; they reach the agent socket on the shared volume.
    server_address = "spire-server"
    server_port    = "8081"

    # The Workload API socket sits in the shared "spire-agent-socket" volume.
    # Every workload container reaches it at /run/spire/agent.sock.
    socket_path = "/run/spire/agent.sock"

    # The agent must trust the server CA before it attests. bootstrap.sh copies
    # the bundle in at runtime. insecure_bootstrap is deliberately NOT used.
    trust_bundle_path = "/run/spire/bootstrap.crt"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/var/lib/spire/agent"
        }
    }

    # The docker attestor produces docker:label:<key>:<value> selectors for the
    # caller's container. An empty plugin_data is correct for cgroups v2. Do not
    # set container_id_cgroup_matchers; that turns on the legacy path.
    WorkloadAttestor "docker" {
        plugin_data {
        }
    }
}
