agent {
    data_dir     = "/var/lib/spire/agent"
    log_level    = "DEBUG"
    trust_domain = "lab.local"

    # Compose service name of the SPIRE server. Workloads never learn this
    # address. Only the agent talks to the server.
    server_address = "spire-server"
    server_port    = "8081"

    # The Workload API endpoint. It sits in the shared "spire-agent-socket"
    # volume, so every workload container reaches it at
    # SPIFFE_ENDPOINT_SOCKET=unix:///run/spire/agent.sock
    socket_path = "/run/spire/agent.sock"

    # The agent must already trust the server's CA before it attests,
    # otherwise the first connection can be intercepted. bootstrap.sh copies
    # the bundle in at runtime, so it never lives in the repository.
    # insecure_bootstrap is deliberately NOT used.
    trust_bundle_path = "/run/spire/bootstrap.crt"
}

plugins {
    # bootstrap.sh writes the join token to a root-only file inside the
    # agent container, points the agent at it, and deletes it after the
    # join. The token never reaches the repository, a log, or a command
    # line.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/var/lib/spire/agent"
        }
    }

    # This plugin is the one difference from lab 1. It produces
    # docker:label:<key>:<value> selectors, one for each label of the caller's
    # container. It also produces docker:env:, docker:image_id: and
    # docker:image_config_digest: selectors.
    #
    # The agent finds the container of a caller in two steps. First it reads
    # /proc/<pid>/cgroup, which the kernel controls. If that file holds no
    # container ID, it reads /proc/<pid>/mountinfo. Under cgroups v2 the first
    # file usually holds only "0::/", so the second one does the work.
    #
    # An empty plugin_data is correct for a normal Docker installation. Do
    # not set container_id_cgroup_matchers here. That option turns on the
    # legacy code path, and the legacy path fails under cgroups v2.
    WorkloadAttestor "docker" {
        plugin_data {
        }
    }
}
